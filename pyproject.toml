[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-supply-chain"
version = "0.1.0"
description = "Leakage-safe grocery demand forecasting and food-waste simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0,<2",
  "pandas>=2.0,<3",
  # pandas 2.x triggers NumPy 2.5's "generic timedelta unit" deprecation on
  # every Timedelta, which NumPy will turn into an error.
  "numpy>=1.26,<2.5",
  "pyarrow>=15,<20",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
modeling = [
  "lightgbm>=4,<5",
  "xgboost>=2,<4",
  "scikit-learn>=1.4,<2",
  "optuna>=3,<5",
  "shap>=0.45,<1",
]
app = ["streamlit>=1.50,<2", "plotly>=5.24,<7", "openpyxl>=3.1,<4"]
ai = ["google-genai>=1,<2"]
dev = [
  "pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.10,<2",
  "types-PyYAML", "pandas-stubs",
]

[project.scripts]
freshcast-pipeline = "src.pipeline:main"
freshcast-train = "src.train:main"
freshcast-report = "src.report:main"

[tool.setuptools.packages.find]
# The code imports `src.*` and `app.*`, so those are the installed packages.
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# NumPy 2.x ships stubs with 3.12-only syntax; mypy cannot parse them as 3.10.
python_version = "3.12"
strict = true
ignore_missing_imports = true
