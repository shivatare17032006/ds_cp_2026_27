[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-supply-chain"
version = "0.1.0"
description = "Leakage-safe grocery demand forecasting and food-waste simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0,<2",
  "pandas>=2.0,<3",
  "pyarrow>=15,<20",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
modeling = [
  "lightgbm>=4,<5",
  "xgboost>=2,<4",
  "scikit-learn>=1.4,<2",
  "optuna>=3,<5",
  "shap>=0.45,<1",
]
app = ["streamlit>=1.50,<2", "plotly>=5.24,<7", "openpyxl>=3.1,<4"]
ai = ["google-genai>=1,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[project.scripts]
freshcast-pipeline = "src.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
